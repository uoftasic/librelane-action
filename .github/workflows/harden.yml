# Reusable workflow: take a student's RTL to GDSII with nothing installed locally.
#
# A course repo calls it like this:
#
#   jobs:
#     harden:
#       uses: uoftasic/librelane-action/.github/workflows/harden.yml@main
#       with:
#         design-dir: labs/lab-05-elevator
#
# It runs the SAME LibreLane version as the workbench, on the SAME config.json the
# student would run locally. It is not a hosted abstraction — it is the real flow on
# someone else's computer.
#
# ── Why this does NOT use `container:` ───────────────────────────────────────
# The official LibreLane image is nix-based and has no dynamic loader at the paths
# the runner expects, so the runner's bundled Node cannot execute inside it:
#
#     exec /__e/node24/bin/node: no such file or directory
#
# That breaks every JavaScript action — checkout, cache, upload-artifact. So the job
# runs on a normal runner and invokes LibreLane through `docker run` for exactly the
# step that needs it. Verified on a real runner, 2026-08-25.
name: Harden to GDSII

on:
  workflow_call:
    inputs:
      design-dir:
        description: Directory containing config.json, relative to the repo root
        required: true
        type: string
      config:
        description: Config filename within design-dir
        required: false
        default: config.json
        type: string
      librelane-image:
        description: Pinned LibreLane image. Match the workbench.
        required: false
        default: ghcr.io/librelane/librelane:3.0.2
        type: string
      pdk-version:
        description: open_pdks commit to pin. Defaults to the workbench's build.
        required: false
        default: 7b70722e33c03fcb5dabcf4d479fb0822d9251c9
        type: string
      action-repo:
        description: Where the helper scripts live. Override only to self-test.
        required: false
        default: uoftasic/librelane-action
        type: string
      action-ref:
        description: Ref of action-repo to use.
        required: false
        default: main
        type: string

concurrency:
  group: harden-${{ github.workflow }}-${{ github.ref }}-${{ inputs.design-dir }}
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the design
        uses: actions/checkout@v4

      # A reusable workflow only gets the caller's files, so the helper scripts
      # have to be fetched explicitly.
      - name: Check out the action's scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.action-repo }}
          ref: ${{ inputs.action-ref }}
          path: .librelane-action

      # ~2 GB and it never changes. Caching turns a slow first run into a fast
      # every-other run.
      - name: Cache the SKY130 PDK
        uses: actions/cache@v4
        with:
          path: .pdks
          key: ciel-sky130-${{ inputs.pdk-version }}

      - name: Refuse a config that does not pin its PDK
        run: python3 .librelane-action/scripts/check_config.py "${{ inputs.design-dir }}/${{ inputs.config }}"

      - name: Pull LibreLane
        run: docker pull -q "${{ inputs.librelane-image }}"

      - name: Harden
        env:
          IMAGE: ${{ inputs.librelane-image }}
          DESIGN_DIR: ${{ inputs.design-dir }}
          CONFIG: ${{ inputs.config }}
          PDK_VERSION: ${{ inputs.pdk-version }}
        run: |
          set -o pipefail
          mkdir -p .pdks
          # --user keeps the outputs owned by the runner user so upload-artifact
          # can read them.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" \
            -e PDK_ROOT=/work/.pdks \
            -w "/work/$DESIGN_DIR" \
            "$IMAGE" bash -c "
              set -e
              ciel enable --pdk-root /work/.pdks --pdk sky130 '$PDK_VERSION' >/dev/null
              { librelane --version; yosys -V; openroad -version; magic --version; } \
                > /work/$DESIGN_DIR/tool-versions.txt 2>&1 || true
              librelane --pdk-root /work/.pdks '$CONFIG'
            " 2>&1 | tee "$DESIGN_DIR/flow.log"

      # Runs even when the flow failed — a student whose flow died needs the
      # summary more than one whose flow passed.
      - name: Tell the student what happened
        if: always()
        run: python3 .librelane-action/scripts/summarise.py "${{ inputs.design-dir }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload your chip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chip-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ inputs.design-dir }}/runs/*/final/gds/*.gds
            ${{ inputs.design-dir }}/runs/*/final/render/*.png
            ${{ inputs.design-dir }}/runs/*/final/metrics.json
            ${{ inputs.design-dir }}/runs/*/final/nl/*.nl.v
            ${{ inputs.design-dir }}/flow.log
