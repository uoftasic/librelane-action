# Copy this into your course repo as .github/workflows/harden.yml
#
# Every push that touches your design hardens it to a GDSII and leaves the layout,
# a picture of it, and the sign-off numbers on the Actions page — without tying up
# your own machine for the length of the run.
name: Harden my design

on:
  push:
    paths:
      - 'labs/lab-05-elevator/**'
      - '.github/workflows/harden.yml'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  harden:
    uses: uoftasic/librelane-action/.github/workflows/harden.yml@main
    with:
      design-dir: labs/lab-05-elevator
